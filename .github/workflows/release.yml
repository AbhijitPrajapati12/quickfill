# Builds the Windows installer and publishes a GitHub release whenever a
# version tag (v1.2.3) is pushed. Create tags with: pnpm release <version>
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} doesn't match tauri.conf.json version $version. Use 'pnpm release' to create tags."
            exit 1
          }

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Build installer and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: QuickFill ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          releaseBody: |
            Download the **`_x64-setup.exe`** file below and run it (Windows 10/11, x64).

            The installer isn't code-signed yet, so Windows SmartScreen may warn you: click **More info → Run anyway**.
